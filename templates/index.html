{% extends 'base-index.html' %}
{% load static %}

{% block css %}
    <link href="{% static "main/css/index.css"%}" rel="stylesheet" type="text/css">
{% endblock %}
{% block main_body %}
    <h1 style="color: black; font-size: 60px">机器学习入侵检测系统</h1><br><br>
    <div class="container">
        <p style="color: black; font-size:20px;font-family: 微软雅黑">欢迎使用机器学习入侵检测系统。该应用程序可以通过机器学习帮助您发现目标系统中的安全漏洞。</p>
        <form id="scan-form" method="post">
            {% csrf_token %}
            <h3>上传你的测试数据集 </h3>
            <div class="custom-file mb-3">
                <input type="file" class="custom-file-input" id="file-input">
                <label class="custom-file-label" for="file-input" id="file-input-label">选择文件(TXT格式)</label>
                <h4>请选择使用的模型</h4>
                <div class="mb-3">
                    <select class="custom-select" id="model-select">
                        <option value="model1">模型：随机森林算法</option>
                        <!-- <option value="model2">模型：KNN（最近邻算法）</option> -->
                        {% if user_tuning_model is not None %}
                            <option value="{{ result_model_path }}">自训练：{{ user_tuning_model }}</option>
                        {% endif %}
                    </select>
    {#                <label class="custom-select-label" for="model-select" id="model-select-label">选择模型</label>#}
                </div>
                <div class="button-container" style="display: flex; justify-content: center; align-items: center; height: 80px;">
                    <button type="submit" class="scan-button" id="scan-button-id" onclick="importData()">开始检测</button>
                    <div class="spinner-border text-primary" style="display: none" role="status" id="loading">
                      <span class="visually-hidden"></span>
                    </div>
                </div>
            </div>
        </form>
        <br>
        <div id="result-echarts" style="display: none">
            <div class="row d-flex justify-content-between">
                <div class="col-md-6">
                    <div class="card mb-5 shadow-sm">
                        <div class="card-body">
                            <div id="chart-container0" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
    
                <div class="col-md-6">
                    <div class="card mb-5 shadow-sm">
                        <div class="card-body">
                            <div id="chart-container1" style="width: 100%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>


{% endblock %}
{% block js %}
    <script src="{% static "main/js/index.js"%}"> </script>
    <script src="{% static "dist/echarts.min.js" %}"></script>
{% endblock %}
